[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_configs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
minversion = "8.4"
pythonpath = ["."]
testpaths = ["tests"]
