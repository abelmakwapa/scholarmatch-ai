    AdminVerificationItem:
      type: object
      additionalProperties: false
      required: [scholarship_id, title, provider, freshness, last_verified_at, changed_fields, source_url]
      properties:
        scholarship_id: { type: string, format: uuid }
        title: { type: string }
        provider: { type: string }
        freshness: { type: string, enum: [current, due, stale, changed] }
        last_verified_at: { type: [string, "null"], format: date-time }
        changed_fields: { type: array, items: { $ref: "#/components/schemas/AdminSourceFieldChange" } }
        source_url: { type: string, format: uri, pattern: "^https://" }
    AdminVerificationPage:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/AdminVerificationItem" } }
        pagination: { $ref: "#/components/schemas/Pagination" }
    AdminVerificationWrite:
      type: object
      additionalProperties: false
      required: [reviewer_notes, accept_source_changes]
      properties:
        reviewer_notes: { type: string, minLength: 1, maxLength: 3000 }
        accept_source_changes: { type: boolean }
    AdminAuditEvent:
      type: object
      additionalProperties: false
      required: [id, actor_id, action, target_type, target_id, target_name, summary, created_at]
      properties:
        id: { type: string, format: uuid }
        actor_id: { type: string, format: uuid }
        action: { type: string }
        target_type: { type: string, enum: [scholarship, ingestion_run, duplicate_group, verification] }
        target_id: { type: string, format: uuid }
        target_name: { type: string }
        summary: { type: string, maxLength: 2000, description: Safe plain-text summary without tokens or imported HTML. }
        created_at: { type: string, format: date-time }
    AdminAuditEventPage:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/AdminAuditEvent" } }
        pagination: { $ref: "#/components/schemas/Pagination" }
    IngestionRunCreate:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source: { type: string, minLength: 1, maxLength: 100 }
        source_url: { type: [string, "null"], format: uri }
        dry_run: { type: boolean, default: false }
    IngestionRunResponse:
      type: object
      additionalProperties: false
      required: [id, source, source_url, status, counters, safe_errors, original_run_id, created_at, updated_at, completed_at]
      properties:
        id: { type: string, format: uuid }
        source: { type: string }
        source_url: { type: [string, "null"], format: uri, pattern: "^https://" }
        status:
          {
            type: string,
            enum: [queued, running, completed, failed, cancelled],
          }
        counters:
          type: object
          additionalProperties: false
          required: [fetched, created, updated, duplicates, rejected]
          properties:
            fetched: { type: integer, minimum: 0 }
            created: { type: integer, minimum: 0 }
            updated: { type: integer, minimum: 0 }
            duplicates: { type: integer, minimum: 0 }
            rejected: { type: integer, minimum: 0 }
        safe_errors:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [code, summary, count]
            properties:
              code: { type: string, pattern: "^[A-Z][A-Z0-9_]+$" }
              summary: { type: string, maxLength: 1000, description: Sanitized plain text without raw payloads, HTML, or tokens. }
              count: { type: integer, minimum: 1 }
        original_run_id: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
    IngestionRunPage:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/IngestionRunResponse" } }
        pagination: { $ref: "#/components/schemas/Pagination" }
