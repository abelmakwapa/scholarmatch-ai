openapi: 3.1.0
info:
  title: ScholarMatch AI API
  version: 1.0.0
  summary: Shared HTTP contract for the ScholarMatch frontend and backend.
  description: |
    The checked-in contract is the source of truth until the FastAPI routes are implemented.
    All identifiers are UUID strings. All timestamps are RFC 3339/ISO-8601 date-time
    strings in UTC. Authenticated operations use a Supabase access token as a Bearer JWT;
    the backend derives the user identity from its verified `sub` claim.

    Collection endpoints use opaque cursor pagination and return `data` plus `pagination`.
    Errors always use `ErrorEnvelope`, including validation and unexpected errors.

    Operations declaring `Idempotency-Key` require a caller-generated, non-secret key.
    The server scopes it to the authenticated actor, method, and path for at least 24 hours.
    Repeating the same key and request payload returns the original status and body with
    `Idempotency-Replayed: true`. Reusing a key with a different payload, or while the
    original request is still in progress, returns `409 IDEMPOTENCY_CONFLICT`.
servers:
  - url: http://localhost:8000/api/v1
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Profile
  - name: Scholarships
  - name: Matches
  - name: Applications
  - name: Documents
  - name: Admin ingestion
paths:
  /profile:
    get:
      operationId: getProfile
      tags: [Profile]
      summary: Get the authenticated student's profile.
      responses:
        "200":
          description: Profile found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      operationId: replaceProfile
      tags: [Profile]
      summary: Create or fully replace the authenticated student's profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileWrite"
      responses:
        "200":
          description: Profile replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
  /profile/documents:
    get:
      operationId: listProfileDocuments
      tags: [Documents]
      summary: List private documents owned by the authenticated student.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Private document page. No storage paths or permanent object URLs are returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: uploadProfileDocument
      tags: [Documents]
      summary: Upload a private profile document for asynchronous processing.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [document_type, file]
              properties:
                document_type:
                  $ref: "#/components/schemas/DocumentType"
                file:
                  type: string
                  format: binary
      responses:
        "202":
          description: Upload accepted for processing.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /profile/documents/policy:
    get:
      operationId: getDocumentUploadPolicy
      tags: [Documents]
      summary: Get the authoritative private-document upload policy.
      responses:
        "200":
          description: Current approved types, MIME types, and maximum file size.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentUploadPolicy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
  /profile/documents/readiness:
    get:
      operationId: getDocumentReadiness
      tags: [Documents]
      summary: Map required scholarship documents to private user documents.
      description: Mapping never shares a file with a scholarship provider.
      responses:
        "200":
          description: Document readiness grouped by tracked application.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentReadinessResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
  /profile/documents/{document_id}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    patch:
      operationId: renameProfileDocument
      tags: [Documents]
      summary: Rename a private document's display name.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentRename" }
      responses:
        "200":
          description: Document renamed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      operationId: replaceProfileDocument
      tags: [Documents]
      summary: Replace the bytes of a private document while retaining its identity.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "202":
          description: Replacement accepted for scanning and processing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: deleteProfileDocument
      tags: [Documents]
      summary: Permanently delete a private document after explicit confirmation.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          {
            description: Document deleted. Readiness mappings are recalculated.,
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
  /profile/documents/{document_id}/download-url:
    post:
      operationId: createDocumentDownloadUrl
      tags: [Documents]
      summary: Create a short-lived signed download URL for one private document.
      description: Permanent object URLs and storage paths are never returned.
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Short-lived URL created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignedDocumentUrlResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /scholarships:
    get:
      operationId: listScholarships
      tags: [Scholarships]
      summary: List published scholarships.
      description: |
        Searches title, provider, field of study, and the normalized description.
        Results include the authenticated student's saved state and current
        eligibility assessment. Funding-amount sorting only compares records
        whose amount and currency are directly comparable.
      parameters:
        - $ref: "#/components/parameters/ScholarshipQuery"
        - $ref: "#/components/parameters/StudyLevel"
        - $ref: "#/components/parameters/Field"
        - $ref: "#/components/parameters/Destination"
        - $ref: "#/components/parameters/Nationality"
        - $ref: "#/components/parameters/Residency"
        - $ref: "#/components/parameters/FundingType"
        - $ref: "#/components/parameters/DeadlineFrom"
        - $ref: "#/components/parameters/DeadlineTo"
        - $ref: "#/components/parameters/Verified"
        - $ref: "#/components/parameters/ScholarshipSort"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Scholarship page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScholarshipPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
  /scholarships/{scholarship_id}:
    get:
      operationId: getScholarship
      tags: [Scholarships]
      summary: Get one published scholarship.
      parameters:
        - $ref: "#/components/parameters/ScholarshipId"
      responses:
        "200":
          description: Scholarship found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScholarshipResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /scholarships/{scholarship_id}/related:
    get:
      operationId: listRelatedScholarships
      tags: [Scholarships]
      summary: List related published scholarships from the current catalogue.
      parameters:
        - $ref: "#/components/parameters/ScholarshipId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Related scholarship page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScholarshipPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /scholarships/{scholarship_id}/saved:
    parameters:
      - $ref: "#/components/parameters/ScholarshipId"
    put:
      operationId: saveScholarship
      tags: [Scholarships]
      summary: Save a scholarship for the authenticated student.
      responses:
        "200":
          description: Scholarship saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedScholarshipResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: unsaveScholarship
      tags: [Scholarships]
      summary: Remove a scholarship from the authenticated student's saved list.
      responses:
        "204": { description: Scholarship removed from saved list. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /scholarships/{scholarship_id}/reports:
    post:
      operationId: reportScholarship
      tags: [Scholarships]
      summary: Report potentially inaccurate scholarship information.
      parameters:
        - $ref: "#/components/parameters/ScholarshipId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScholarshipReportCreate" }
      responses:
        "201":
          description: Report received.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScholarshipReportResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
  /matches:
    get:
      operationId: listMatches
      tags: [Matches]
      summary: List ranked matches for the authenticated student.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Match page, ordered by descending score with a stable ID tie-breaker.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
  /matches/recalculate:
    post:
      operationId: recalculateMatches
      tags: [Matches]
      summary: Queue a match recalculation for the authenticated student.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Recalculation queued.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /matches/recalculation-jobs/{job_id}:
    get:
      operationId: getMatchRecalculationJob
      tags: [Matches]
      summary: Get the status of a match recalculation job.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Recalculation job status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /matches/{scholarship_id}:
    get:
      operationId: getMatch
      tags: [Matches]
      summary: Get the authenticated student's match for one scholarship.
      parameters:
        - $ref: "#/components/parameters/ScholarshipId"
      responses:
        "200":
          description: Match found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /matches/{scholarship_id}/feedback:
    post:
      operationId: createMatchFeedback
      tags: [Matches]
      summary: Record structured feedback about one match explanation.
      description: Feedback is reviewed and evaluated; submission does not immediately retrain a model.
      parameters:
        - $ref: "#/components/parameters/ScholarshipId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatchFeedbackCreate" }
      responses:
        "201":
          description: Feedback received.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchFeedbackResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /applications:
    get:
      operationId: listApplications
      tags: [Applications]
      summary: List applications owned by the authenticated student.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Application page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
  /applications/deadlines:
    get:
      operationId: listApplicationDeadlines
      tags: [Applications]
      summary: List calendar-friendly deadlines for tracked applications.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Deadline page ordered chronologically with undated items last.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDeadlinePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: createApplication
      tags: [Applications]
      summary: Start tracking an application.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationCreate"
      responses:
        "201":
          description: Application created.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
  /applications/{application_id}:
    patch:
      operationId: updateApplication
      tags: [Applications]
      summary: Update mutable application tracking fields.
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationUpdate"
      responses:
        "200":
          description: Application updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
  /applications/{application_id}/checklist/{checklist_item_id}:
    put:
      operationId: updateApplicationChecklistItem
      tags: [Applications]
      summary: Set one checklist item's completion state.
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/ChecklistItemId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChecklistItemUpdate" }
      responses:
        "200":
          description: Application with refreshed checklist and readiness.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
  /applications/{application_id}/reminder:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    put:
      operationId: setApplicationReminder
      tags: [Applications]
      summary: Create or replace a private application reminder.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationReminderWrite" }
      responses:
        "200":
          description: Application with updated reminder.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: deleteApplicationReminder
      tags: [Applications]
      summary: Remove an application reminder.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Application with reminder removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
  /admin/ingestion-runs:
    post:
      operationId: createIngestionRun
      tags: [Admin ingestion]
      summary: Queue a scholarship ingestion run.
      description: Requires a verified JWT with the application admin role.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestionRunCreate"
      responses:
        "202":
          description: Ingestion run queued.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionRunResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /admin/ingestion-runs/{run_id}:
    get:
      operationId: getIngestionRun
      tags: [Admin ingestion]
      summary: Get one ingestion run and its counters.
      description: Requires a verified JWT with the application admin role.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Ingestion run found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionRunResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase access token; the API verifies signature, issuer, audience, expiry, and subject.
  parameters:
    ScholarshipQuery:
      name: q
      in: query
      required: false
      description: Searches title, provider, field, and normalized description.
      schema: { type: string, minLength: 1, maxLength: 200 }
    StudyLevel:
      name: study_level
      in: query
      required: false
      schema: { $ref: "#/components/schemas/ScholarshipStudyLevel" }
    Field:
      name: field
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 100 }
    Destination:
      name: destination
      in: query
      required: false
      schema:
        {
          type: string,
          minLength: 2,
          maxLength: 2,
          description: ISO 3166-1 alpha-2 code.,
        }
    Nationality:
      name: nationality
      in: query
      required: false
      schema:
        {
          type: string,
          minLength: 2,
          maxLength: 2,
          description: ISO 3166-1 alpha-2 code used for compatibility filtering.,
        }
    Residency:
      name: residency
      in: query
      required: false
      schema:
        {
          type: string,
          minLength: 2,
          maxLength: 2,
          description: ISO 3166-1 alpha-2 code used for compatibility filtering.,
        }
    FundingType:
      name: funding_type
      in: query
      required: false
      schema: { $ref: "#/components/schemas/FundingType" }
    DeadlineFrom:
      name: deadline_from
      in: query
      required: false
      schema: { type: string, format: date }
    DeadlineTo:
      name: deadline_to
      in: query
      required: false
      schema: { type: string, format: date }
    Verified:
      name: verified
      in: query
      required: false
      schema: { type: boolean }
    ScholarshipSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [relevance, deadline, recently_verified, funding_amount]
        default: relevance
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned as `pagination.next_cursor`; clients must not parse it.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Caller-generated opaque key. Do not include credentials or personal data.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9._~-]+$"
    ScholarshipId:
      name: scholarship_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApplicationId:
      name: application_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RunId:
      name: run_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentId:
      name: document_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChecklistItemId:
      name: checklist_item_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    JobId:
      name: job_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  headers:
    IdempotencyReplayed:
      description: "`true` when this response replays a completed request."
      schema: { type: boolean }
  responses:
    BadRequest:
      description: Malformed request or cursor.
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorEnvelope" } },
        }
    Unauthorized:
      description: Bearer token is missing or invalid.
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorEnvelope" } },
        }
    Forbidden:
      description: Authenticated actor lacks the required role or permission.
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorEnvelope" } },
        }
    NotFound:
      description: Resource was not found or is not visible to the actor.
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorEnvelope" } },
        }
    Conflict:
      description: State, duplicate resource, or idempotency conflict.
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorEnvelope" } },
        }
    PayloadTooLarge:
      description: Uploaded file exceeds the configured limit.
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorEnvelope" } },
        }
    UnsupportedMediaType:
      description: Uploaded file type is not allowed.
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorEnvelope" } },
        }
    ValidationError:
      description: Request fields failed semantic validation.
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorEnvelope" } },
        }
    RateLimited:
      description: Request rate exceeded.
      headers:
        Retry-After:
          description: Seconds until the client should retry.
          schema: { type: integer, minimum: 1 }
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorEnvelope" } },
        }
    InternalError:
      description: Unexpected server error with no sensitive implementation details.
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorEnvelope" } },
        }
  schemas:
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details, request_id]
          properties:
            code:
              type: string
              pattern: "^[A-Z][A-Z0-9_]+$"
              examples: [VALIDATION_ERROR]
            message:
              type: string
              description: Safe, human-readable summary.
            details:
              type: array
              description: Safe structured details; empty when no field-specific detail exists.
              default: []
              items:
                type: object
                additionalProperties: false
                required: [code]
                properties:
                  code: { type: string }
                  field: { type: [string, "null"] }
                  message: { type: [string, "null"] }
            request_id:
              type: string
              format: uuid
    Pagination:
      type: object
      additionalProperties: false
      required: [next_cursor, has_more, limit]
      properties:
        next_cursor:
          type: [string, "null"]
          description: Opaque cursor for the next page; null on the final page.
        has_more: { type: boolean }
        limit: { type: integer, minimum: 1, maximum: 100 }
    ProfileWrite:
      type: object
      additionalProperties: false
      required: [full_name, country, study_level, interests]
      properties:
        full_name: { type: string, minLength: 1, maxLength: 200 }
        country:
          {
            type: string,
            minLength: 2,
            maxLength: 2,
            description: ISO 3166-1 alpha-2 code.,
          }
        study_level:
          { type: string, enum: [undergraduate, postgraduate, doctoral, other] }
        field_of_study: { type: [string, "null"], maxLength: 200 }
        gpa: { type: [number, "null"], minimum: 0, maximum: 4 }
        interests:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 100 }
        goals: { type: [string, "null"], maxLength: 4000 }
    ProfileResponse:
      type: object
      additionalProperties: false
      required:
        [id, full_name, country, study_level, interests, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string, minLength: 1, maxLength: 200 }
        country:
          {
            type: string,
            minLength: 2,
            maxLength: 2,
            description: ISO 3166-1 alpha-2 code.,
          }
        study_level:
          { type: string, enum: [undergraduate, postgraduate, doctoral, other] }
        field_of_study: { type: [string, "null"], maxLength: 200 }
        gpa: { type: [number, "null"], minimum: 0, maximum: 4 }
        interests:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 100 }
        goals: { type: [string, "null"], maxLength: 4000 }
        created_at:
          {
            type: string,
            format: date-time,
            description: UTC ISO-8601 timestamp.,
          }
        updated_at:
          {
            type: string,
            format: date-time,
            description: UTC ISO-8601 timestamp.,
          }
    DocumentType:
      type: string
      enum:
        [
          transcript,
          cv,
          recommendation_letter,
          personal_statement,
          identity_document,
          financial_document,
          other,
        ]
    DocumentResponse:
      type: object
      additionalProperties: false
      required:
        [
          id,
          document_type,
          display_name,
          original_filename,
          mime_type,
          size_bytes,
          status,
          scan_status,
          replaced_at,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        document_type: { $ref: "#/components/schemas/DocumentType" }
        display_name: { type: string, minLength: 1, maxLength: 200 }
        original_filename: { type: string, minLength: 1, maxLength: 255 }
        mime_type: { type: string }
        size_bytes: { type: integer, minimum: 1 }
        status:
          {
            type: string,
            enum: [pending, scanning, processing, ready, rejected, failed],
          }
        scan_status: { type: string, enum: [pending, clean, infected, failed] }
        replaced_at: { type: [string, "null"], format: date-time }
        created_at:
          {
            type: string,
            format: date-time,
            description: UTC ISO-8601 timestamp.,
          }
        updated_at:
          {
            type: string,
            format: date-time,
            description: UTC ISO-8601 timestamp.,
          }
    DocumentPage:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data:
          {
            type: array,
            items: { $ref: "#/components/schemas/DocumentResponse" },
          }
        pagination: { $ref: "#/components/schemas/Pagination" }
    DocumentUploadPolicy:
      type: object
      additionalProperties: false
      required:
        [
          max_size_bytes,
          allowed_mime_types,
          allowed_document_types,
          accepted_extensions,
        ]
      properties:
        max_size_bytes: { type: integer, minimum: 1 }
        allowed_mime_types:
          type: array
          minItems: 1
          items: { type: string }
        allowed_document_types:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/DocumentType" }
        accepted_extensions:
          type: array
          minItems: 1
          items: { type: string, pattern: "^\\.[a-z0-9]+$" }
    DocumentRename:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 200 }
    SignedDocumentUrlResponse:
      type: object
      additionalProperties: false
      required: [url, expires_at]
      properties:
        url:
          type: string
          format: uri
          description: Short-lived signed download URL; never persist or share it.
        expires_at:
          {
            type: string,
            format: date-time,
            description: UTC ISO-8601 timestamp.,
          }
    DocumentReadinessItem:
      type: object
      additionalProperties: false
      required:
        [required_document, ready, matched_document_ids, shared_externally]
      properties:
        required_document: { type: string }
        ready: { type: boolean }
        matched_document_ids:
          type: array
          items: { type: string, format: uuid }
        shared_externally:
          type: boolean
          const: false
          description: Readiness mapping never shares private documents externally.
    ApplicationDocumentReadiness:
      type: object
      additionalProperties: false
      required: [application_id, scholarship_title, items]
      properties:
        application_id: { type: string, format: uuid }
        scholarship_title: { type: string }
        items:
          {
            type: array,
            items: { $ref: "#/components/schemas/DocumentReadinessItem" },
          }
    DocumentReadinessResponse:
      type: object
      additionalProperties: false
      required: [applications, updated_at]
      properties:
        applications:
          type: array
          items: { $ref: "#/components/schemas/ApplicationDocumentReadiness" }
        updated_at:
          {
            type: string,
            format: date-time,
            description: UTC ISO-8601 timestamp.,
          }
    ScholarshipStudyLevel:
      type: string
      enum: [undergraduate, postgraduate, doctoral, other]
    FundingType:
      type: string
      enum: [full, partial, tuition, stipend, research, other]
    EligibilityStatus:
      type: string
      enum: [eligible, potentially_eligible, ineligible, unknown]
    EligibilityAssessment:
      type: object
      additionalProperties: false
      required: [status, summary, reasons, missing_facts]
      properties:
        status: { $ref: "#/components/schemas/EligibilityStatus" }
        summary: { type: string }
        reasons: { type: array, items: { type: string } }
        missing_facts: { type: array, items: { type: string } }
    ScholarshipProvenance:
      type: object
      additionalProperties: false
      required: [source_name, source_url, ingested_at, last_checked_at]
      properties:
        source_name: { type: string }
        source_url: { type: string, format: uri }
        ingested_at: { type: string, format: date-time }
        last_checked_at: { type: string, format: date-time }
    ScholarshipResponse:
      type: object
      additionalProperties: false
      required:
        [
          id,
          title,
          provider,
          funding_type,
          study_levels,
          fields_of_study,
          destination_countries,
          nationality_requirements,
          residency_requirements,
          requirements,
          required_documents,
          source_url,
          provenance,
          verified_at,
          saved,
          eligibility,
          deadline,
          status,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        provider: { type: string }
        description: { type: [string, "null"] }
        amount: { type: [number, "null"], minimum: 0 }
        currency: { type: [string, "null"], minLength: 3, maxLength: 3 }
        funding_type: { $ref: "#/components/schemas/FundingType" }
        funding_summary: { type: [string, "null"] }
        study_levels:
          {
            type: array,
            items: { $ref: "#/components/schemas/ScholarshipStudyLevel" },
          }
        fields_of_study: { type: array, items: { type: string } }
        destination_countries:
          { type: array, items: { type: string, minLength: 2, maxLength: 2 } }
        nationality_requirements: { type: array, items: { type: string } }
        residency_requirements: { type: array, items: { type: string } }
        deadline: { type: [string, "null"], format: date }
        eligibility_summary: { type: [string, "null"] }
        eligibility: { $ref: "#/components/schemas/EligibilityAssessment" }
        requirements: { type: array, items: { type: string } }
        required_documents: { type: array, items: { type: string } }
        source_url: { type: string, format: uri }
        application_url: { type: [string, "null"], format: uri }
        provenance: { $ref: "#/components/schemas/ScholarshipProvenance" }
        verified_at: { type: [string, "null"], format: date-time }
        saved: { type: boolean }
        status: { type: string, enum: [published, closed] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ScholarshipPage:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data:
          {
            type: array,
            items: { $ref: "#/components/schemas/ScholarshipResponse" },
          }
        pagination: { $ref: "#/components/schemas/Pagination" }
    SavedScholarshipResponse:
      type: object
      additionalProperties: false
      required: [scholarship_id, saved, updated_at]
      properties:
        scholarship_id: { type: string, format: uuid }
        saved: { type: boolean }
        updated_at: { type: string, format: date-time }
    ScholarshipReportCreate:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          enum:
            [
              expired,
              incorrect_deadline,
              incorrect_eligibility,
              broken_source,
              other,
            ]
        details: { type: [string, "null"], maxLength: 2000 }
    ScholarshipReportResponse:
      type: object
      additionalProperties: false
      required: [id, scholarship_id, status, created_at]
      properties:
        id: { type: string, format: uuid }
        scholarship_id: { type: string, format: uuid }
        status: { type: string, enum: [received] }
        created_at: { type: string, format: date-time }
    ScoreComponent:
      type: object
      additionalProperties: false
      required: [name, score, weight]
      properties:
        name:
          type: string
          enum:
            [
              academics,
              eligibility_fit,
              interests_goals,
              experience,
              readiness_timing,
            ]
        score: { type: number, minimum: 0, maximum: 1 }
        weight: { type: number, minimum: 0, maximum: 1 }
    MissingProfileFact:
      type: object
      additionalProperties: false
      required: [field, question]
      properties:
        field: { type: string }
        question: { type: string }
    MatchExplanation:
      type: object
      additionalProperties: false
      required:
        [
          why_this_matches,
          what_may_block_you,
          missing_information,
          next_actions,
        ]
      properties:
        why_this_matches: { type: array, items: { type: string } }
        what_may_block_you: { type: array, items: { type: string } }
        missing_information:
          type: array
          items: { $ref: "#/components/schemas/MissingProfileFact" }
        next_actions: { type: array, items: { type: string } }
    RequirementEvidence:
      type: object
      additionalProperties: false
      required: [label, detail, basis, source_url]
      properties:
        label: { type: string }
        detail: { type: string }
        basis:
          type: string
          enum:
            [
              verified_requirement,
              inferred_relevance,
              profile_unknown,
              requirement_not_met,
            ]
        source_url: { type: [string, "null"], format: uri }
    MatchResponse:
      type: object
      additionalProperties: false
      required:
        [
          id,
          rank,
          scholarship,
          score,
          confidence,
          score_components,
          requirement_evidence,
          deterministic_explanation,
          ai_explanation,
          explanation_status,
          algorithm_version,
          calculation_status,
          stale_reasons,
          calculated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        rank: { type: integer, minimum: 1 }
        scholarship: { $ref: "#/components/schemas/ScholarshipResponse" }
        score:
          type: number
          minimum: 0
          maximum: 1
          description: Relative profile-to-scholarship fit score; never a probability of winning.
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Confidence in the score inputs based on profile and requirement completeness; never a probability of winning.
        score_components:
          {
            type: array,
            items: { $ref: "#/components/schemas/ScoreComponent" },
          }
        requirement_evidence:
          type: array
          items: { $ref: "#/components/schemas/RequirementEvidence" }
        deterministic_explanation:
          { $ref: "#/components/schemas/MatchExplanation" }
        ai_explanation:
          oneOf:
            - $ref: "#/components/schemas/MatchExplanation"
            - type: "null"
        reasons: { type: array, items: { type: string } }
        gaps: { type: array, items: { type: string } }
        explanation_status:
          { type: string, enum: [pending, ready, unavailable] }
        algorithm_version: { type: string }
        calculation_status: { type: string, enum: [current, stale] }
        stale_reasons: { type: array, items: { type: string } }
        calculated_at: { type: string, format: date-time }
    MatchPage:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data:
          { type: array, items: { $ref: "#/components/schemas/MatchResponse" } }
        pagination: { $ref: "#/components/schemas/Pagination" }
    ApplicationStatus:
      type: string
      enum:
        [
          saved,
          preparing,
          ready,
          submitted,
          interview,
          awarded,
          unsuccessful,
          withdrawn,
        ]
    ApplicationCreate:
      type: object
      additionalProperties: false
      required: [scholarship_id]
      properties:
        scholarship_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/ApplicationStatus" }
        notes: { type: [string, "null"], maxLength: 10000 }
    ApplicationUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status: { $ref: "#/components/schemas/ApplicationStatus" }
        notes: { type: [string, "null"], maxLength: 10000 }
    ChecklistItemUpdate:
      type: object
      additionalProperties: false
      required: [completed]
      properties:
        completed: { type: boolean }
    ApplicationChecklistItem:
      type: object
      additionalProperties: false
      required: [id, label, required, completed, updated_at]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        required: { type: boolean }
        completed: { type: boolean }
        updated_at:
          {
            type: string,
            format: date-time,
            description: UTC ISO-8601 timestamp.,
          }
    ApplicationReminderWrite:
      type: object
      additionalProperties: false
      required: [remind_at, timezone]
      properties:
        remind_at:
          {
            type: string,
            format: date-time,
            description: UTC ISO-8601 timestamp.,
          }
        timezone:
          {
            type: string,
            description: IANA timezone used when the reminder was entered.,
          }
    ApplicationReminder:
      allOf:
        - $ref: "#/components/schemas/ApplicationReminderWrite"
        - type: object
          additionalProperties: false
          required: [created_at, updated_at]
          properties:
            created_at:
              {
                type: string,
                format: date-time,
                description: UTC ISO-8601 timestamp.,
              }
            updated_at:
              {
                type: string,
                format: date-time,
                description: UTC ISO-8601 timestamp.,
              }
    ApplicationStatusHistoryItem:
      type: object
      additionalProperties: false
      required: [id, from_status, to_status, changed_at]
      description: Append-only audit record; status-history mutations are not exposed.
      properties:
        id: { type: string, format: uuid }
        from_status:
          oneOf:
            - $ref: "#/components/schemas/ApplicationStatus"
            - type: "null"
        to_status: { $ref: "#/components/schemas/ApplicationStatus" }
        changed_at:
          {
            type: string,
            format: date-time,
            description: UTC ISO-8601 timestamp.,
          }
    ApplicationResponse:
      type: object
      additionalProperties: false
      required:
        [
          id,
          scholarship_id,
          scholarship,
          status,
          allowed_transitions,
          checklist,
          document_readiness,
          status_history,
          reminder,
          notes,
          deadline_at,
          deadline_timezone,
          submitted_at,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        scholarship_id: { type: string, format: uuid }
        scholarship: { $ref: "#/components/schemas/ScholarshipResponse" }
        status: { $ref: "#/components/schemas/ApplicationStatus" }
        allowed_transitions:
          type: array
          description: Server-authoritative next states for this application.
          items: { $ref: "#/components/schemas/ApplicationStatus" }
        checklist:
          type: array
          items: { $ref: "#/components/schemas/ApplicationChecklistItem" }
        document_readiness:
          type: array
          items: { $ref: "#/components/schemas/DocumentReadinessItem" }
        status_history:
          type: array
          items: { $ref: "#/components/schemas/ApplicationStatusHistoryItem" }
        reminder:
          oneOf:
            - $ref: "#/components/schemas/ApplicationReminder"
            - type: "null"
        notes: { type: [string, "null"] }
        deadline_at:
          {
            type: [string, "null"],
            format: date-time,
            description: UTC ISO-8601 timestamp when a precise deadline is known.,
          }
        deadline_timezone:
          {
            type: [string, "null"],
            description: Provider-published IANA timezone when known.,
          }
        submitted_at: { type: [string, "null"], format: date-time }
        created_at:
          {
            type: string,
            format: date-time,
            description: UTC ISO-8601 timestamp.,
          }
        updated_at:
          {
            type: string,
            format: date-time,
            description: UTC ISO-8601 timestamp.,
          }
    ApplicationPage:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data:
          {
            type: array,
            items: { $ref: "#/components/schemas/ApplicationResponse" },
          }
        pagination: { $ref: "#/components/schemas/Pagination" }
    ApplicationDeadline:
      type: object
      additionalProperties: false
      required:
        [
          application_id,
          scholarship_id,
          title,
          provider,
          status,
          deadline_date,
          deadline_at,
