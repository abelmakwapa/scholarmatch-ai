openapi: 3.1.0
info:
  title: ScholarMatch AI API
  version: 1.0.0
  summary: Shared HTTP contract for the ScholarMatch frontend and backend.
  description: |
    The checked-in contract is the source of truth until the FastAPI routes are implemented.
    All identifiers are UUID strings. All timestamps are RFC 3339/ISO-8601 date-time
    strings in UTC. Authenticated operations use a Supabase access token as a Bearer JWT;
    the backend derives the user identity from its verified `sub` claim.

    Collection endpoints use opaque cursor pagination and return `data` plus `pagination`.
    Errors always use `ErrorEnvelope`, including validation and unexpected errors.

    Operations declaring `Idempotency-Key` require a caller-generated, non-secret key.
    The server scopes it to the authenticated actor, method, and path for at least 24 hours.
    Repeating the same key and request payload returns the original status and body with
    `Idempotency-Replayed: true`. Reusing a key with a different payload, or while the
    original request is still in progress, returns `409 IDEMPOTENCY_CONFLICT`.
servers:
  - url: http://localhost:8000/api/v1
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Profile
  - name: Scholarships
  - name: Matches
  - name: Applications
  - name: Documents
  - name: Admin ingestion
paths:
  /profile:
    get:
      operationId: getProfile
      tags: [Profile]
      summary: Get the authenticated student's profile.
      responses:
        "200":
          description: Profile found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      operationId: replaceProfile
      tags: [Profile]
      summary: Create or fully replace the authenticated student's profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileWrite"
      responses:
        "200":
          description: Profile replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
  /profile/documents:
    post:
      operationId: uploadProfileDocument
      tags: [Documents]
      summary: Upload a private profile document for asynchronous processing.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [document_type, file]
              properties:
                document_type:
                  $ref: "#/components/schemas/DocumentType"
                file:
                  type: string
                  format: binary
      responses:
        "202":
          description: Upload accepted for processing.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /scholarships:
    get:
      operationId: listScholarships
      tags: [Scholarships]
      summary: List published scholarships.
      description: |
        Searches title, provider, field of study, and the normalized description.
        Results include the authenticated student's saved state and current
        eligibility assessment. Funding-amount sorting only compares records
        whose amount and currency are directly comparable.
      parameters:
        - $ref: "#/components/parameters/ScholarshipQuery"
        - $ref: "#/components/parameters/StudyLevel"
        - $ref: "#/components/parameters/Field"
        - $ref: "#/components/parameters/Destination"
        - $ref: "#/components/parameters/Nationality"
        - $ref: "#/components/parameters/Residency"
        - $ref: "#/components/parameters/FundingType"
        - $ref: "#/components/parameters/DeadlineFrom"
        - $ref: "#/components/parameters/DeadlineTo"
        - $ref: "#/components/parameters/Verified"
        - $ref: "#/components/parameters/ScholarshipSort"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Scholarship page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScholarshipPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
  /scholarships/{scholarship_id}:
    get:
      operationId: getScholarship
      tags: [Scholarships]
      summary: Get one published scholarship.
      parameters:
        - $ref: "#/components/parameters/ScholarshipId"
      responses:
        "200":
          description: Scholarship found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScholarshipResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /scholarships/{scholarship_id}/related:
    get:
      operationId: listRelatedScholarships
      tags: [Scholarships]
      summary: List related published scholarships from the current catalogue.
      parameters:
        - $ref: "#/components/parameters/ScholarshipId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Related scholarship page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScholarshipPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /scholarships/{scholarship_id}/saved:
    parameters:
      - $ref: "#/components/parameters/ScholarshipId"
    put:
      operationId: saveScholarship
      tags: [Scholarships]
      summary: Save a scholarship for the authenticated student.
      responses:
        "200":
          description: Scholarship saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedScholarshipResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: unsaveScholarship
      tags: [Scholarships]
      summary: Remove a scholarship from the authenticated student's saved list.
      responses:
        "204": { description: Scholarship removed from saved list. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /scholarships/{scholarship_id}/reports:
    post:
      operationId: reportScholarship
      tags: [Scholarships]
      summary: Report potentially inaccurate scholarship information.
      parameters:
        - $ref: "#/components/parameters/ScholarshipId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScholarshipReportCreate" }
      responses:
        "201":
          description: Report received.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScholarshipReportResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
  /matches:
    get:
      operationId: listMatches
      tags: [Matches]
      summary: List ranked matches for the authenticated student.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Match page, ordered by descending score with a stable ID tie-breaker.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
  /matches/recalculate:
    post:
      operationId: recalculateMatches
      tags: [Matches]
      summary: Queue a match recalculation for the authenticated student.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Recalculation queued.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /matches/{scholarship_id}:
    get:
      operationId: getMatch
      tags: [Matches]
      summary: Get the authenticated student's match for one scholarship.
      parameters:
        - $ref: "#/components/parameters/ScholarshipId"
      responses:
        "200":
          description: Match found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /applications:
    get:
      operationId: listApplications
      tags: [Applications]
      summary: List applications owned by the authenticated student.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Application page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: createApplication
      tags: [Applications]
      summary: Start tracking an application.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationCreate"
      responses:
        "201":
          description: Application created.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
  /applications/{application_id}:
    patch:
      operationId: updateApplication
      tags: [Applications]
      summary: Update mutable application tracking fields.
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationUpdate"
      responses:
        "200":
          description: Application updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
  /admin/ingestion-runs:
    post:
      operationId: createIngestionRun
      tags: [Admin ingestion]
      summary: Queue a scholarship ingestion run.
      description: Requires a verified JWT with the application admin role.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestionRunCreate"
      responses:
        "202":
          description: Ingestion run queued.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionRunResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /admin/ingestion-runs/{run_id}:
    get:
      operationId: getIngestionRun
      tags: [Admin ingestion]
      summary: Get one ingestion run and its counters.
      description: Requires a verified JWT with the application admin role.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Ingestion run found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionRunResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase access token; the API verifies signature, issuer, audience, expiry, and subject.
  parameters:
    ScholarshipQuery:
      name: q
      in: query
      required: false
      description: Searches title, provider, field, and normalized description.
      schema: { type: string, minLength: 1, maxLength: 200 }
    StudyLevel:
      name: study_level
      in: query
      required: false
      schema: { $ref: "#/components/schemas/ScholarshipStudyLevel" }
    Field:
      name: field
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 100 }
    Destination:
      name: destination
      in: query
      required: false
      schema: { type: string, minLength: 2, maxLength: 2, description: ISO 3166-1 alpha-2 code. }
    Nationality:
      name: nationality
      in: query
      required: false
      schema: { type: string, minLength: 2, maxLength: 2, description: ISO 3166-1 alpha-2 code used for compatibility filtering. }
    Residency:
      name: residency
      in: query
      required: false
      schema: { type: string, minLength: 2, maxLength: 2, description: ISO 3166-1 alpha-2 code used for compatibility filtering. }
    FundingType:
      name: funding_type
      in: query
      required: false
      schema: { $ref: "#/components/schemas/FundingType" }
    DeadlineFrom:
      name: deadline_from
      in: query
      required: false
      schema: { type: string, format: date }
    DeadlineTo:
      name: deadline_to
      in: query
      required: false
      schema: { type: string, format: date }
    Verified:
      name: verified
      in: query
      required: false
      schema: { type: boolean }
    ScholarshipSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [relevance, deadline, recently_verified, funding_amount]
        default: relevance
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned as `pagination.next_cursor`; clients must not parse it.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Caller-generated opaque key. Do not include credentials or personal data.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9._~-]+$"
    ScholarshipId:
      name: scholarship_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApplicationId:
      name: application_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RunId:
      name: run_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  headers:
    IdempotencyReplayed:
      description: "`true` when this response replays a completed request."
      schema: { type: boolean }
  responses:
    BadRequest:
      description: Malformed request or cursor.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    Unauthorized:
      description: Bearer token is missing or invalid.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    Forbidden:
      description: Authenticated actor lacks the required role or permission.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    NotFound:
      description: Resource was not found or is not visible to the actor.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    Conflict:
      description: State, duplicate resource, or idempotency conflict.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    PayloadTooLarge:
      description: Uploaded file exceeds the configured limit.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    UnsupportedMediaType:
      description: Uploaded file type is not allowed.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    ValidationError:
      description: Request fields failed semantic validation.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    RateLimited:
      description: Request rate exceeded.
      headers:
        Retry-After:
          description: Seconds until the client should retry.
          schema: { type: integer, minimum: 1 }
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    InternalError:
      description: Unexpected server error with no sensitive implementation details.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
  schemas:
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details, request_id]
          properties:
            code:
              type: string
              pattern: "^[A-Z][A-Z0-9_]+$"
              examples: [VALIDATION_ERROR]
            message:
              type: string
              description: Safe, human-readable summary.
            details:
              type: array
              description: Safe structured details; empty when no field-specific detail exists.
              default: []
              items:
                type: object
                additionalProperties: false
                required: [code]
                properties:
                  code: { type: string }
                  field: { type: [string, "null"] }
                  message: { type: [string, "null"] }
            request_id:
              type: string
              format: uuid
    Pagination:
      type: object
      additionalProperties: false
      required: [next_cursor, has_more, limit]
      properties:
        next_cursor:
          type: [string, "null"]
          description: Opaque cursor for the next page; null on the final page.
        has_more: { type: boolean }
        limit: { type: integer, minimum: 1, maximum: 100 }
    ProfileWrite:
      type: object
      additionalProperties: false
      required: [full_name, country, study_level, interests]
      properties:
        full_name: { type: string, minLength: 1, maxLength: 200 }
        country: { type: string, minLength: 2, maxLength: 2, description: ISO 3166-1 alpha-2 code. }
        study_level: { type: string, enum: [undergraduate, postgraduate, doctoral, other] }
        field_of_study: { type: [string, "null"], maxLength: 200 }
        gpa: { type: [number, "null"], minimum: 0, maximum: 4 }
        interests:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 100 }
        goals: { type: [string, "null"], maxLength: 4000 }
    ProfileResponse:
      type: object
      additionalProperties: false
      required: [id, full_name, country, study_level, interests, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string, minLength: 1, maxLength: 200 }
        country: { type: string, minLength: 2, maxLength: 2, description: ISO 3166-1 alpha-2 code. }
        study_level: { type: string, enum: [undergraduate, postgraduate, doctoral, other] }
        field_of_study: { type: [string, "null"], maxLength: 200 }
        gpa: { type: [number, "null"], minimum: 0, maximum: 4 }
        interests:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 100 }
        goals: { type: [string, "null"], maxLength: 4000 }
        created_at: { type: string, format: date-time, description: UTC ISO-8601 timestamp. }
        updated_at: { type: string, format: date-time, description: UTC ISO-8601 timestamp. }
    DocumentType:
      type: string
      enum: [transcript, cv, recommendation_letter, other]
    DocumentResponse:
      type: object
      additionalProperties: false
      required: [id, document_type, filename, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        document_type: { $ref: "#/components/schemas/DocumentType" }
        filename: { type: string }
        status: { type: string, enum: [pending, processing, ready, rejected, failed] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ScholarshipStudyLevel:
      type: string
      enum: [undergraduate, postgraduate, doctoral, other]
    FundingType:
      type: string
      enum: [full, partial, tuition, stipend, research, other]
    EligibilityStatus:
      type: string
      enum: [eligible, potentially_eligible, ineligible, unknown]
    EligibilityAssessment:
      type: object
      additionalProperties: false
      required: [status, summary, reasons, missing_facts]
      properties:
        status: { $ref: "#/components/schemas/EligibilityStatus" }
        summary: { type: string }
        reasons: { type: array, items: { type: string } }
        missing_facts: { type: array, items: { type: string } }
    ScholarshipProvenance:
      type: object
      additionalProperties: false
      required: [source_name, source_url, ingested_at, last_checked_at]
      properties:
        source_name: { type: string }
        source_url: { type: string, format: uri }
        ingested_at: { type: string, format: date-time }
        last_checked_at: { type: string, format: date-time }
    ScholarshipResponse:
      type: object
      additionalProperties: false
      required: [id, title, provider, funding_type, study_levels, fields_of_study, destination_countries, nationality_requirements, residency_requirements, requirements, required_documents, source_url, provenance, verified_at, saved, eligibility, deadline, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        provider: { type: string }
        description: { type: [string, "null"] }
        amount: { type: [number, "null"], minimum: 0 }
        currency: { type: [string, "null"], minLength: 3, maxLength: 3 }
        funding_type: { $ref: "#/components/schemas/FundingType" }
        funding_summary: { type: [string, "null"] }
        study_levels: { type: array, items: { $ref: "#/components/schemas/ScholarshipStudyLevel" } }
        fields_of_study: { type: array, items: { type: string } }
        destination_countries: { type: array, items: { type: string, minLength: 2, maxLength: 2 } }
        nationality_requirements: { type: array, items: { type: string } }
        residency_requirements: { type: array, items: { type: string } }
        deadline: { type: [string, "null"], format: date }
        eligibility_summary: { type: [string, "null"] }
        eligibility: { $ref: "#/components/schemas/EligibilityAssessment" }
