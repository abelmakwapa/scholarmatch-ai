openapi: 3.1.0
info:
  title: ScholarMatch AI API
  version: 1.0.0
  summary: Shared HTTP contract for the ScholarMatch frontend and backend.
  description: |
    The checked-in contract is the source of truth until the FastAPI routes are implemented.
    All identifiers are UUID strings. All timestamps are RFC 3339/ISO-8601 date-time
    strings in UTC. Authenticated operations use a Supabase access token as a Bearer JWT;
    the backend derives the user identity from its verified `sub` claim.

    Collection endpoints use opaque cursor pagination and return `data` plus `pagination`.
    Errors always use `ErrorEnvelope`, including validation and unexpected errors.

    Operations declaring `Idempotency-Key` require a caller-generated, non-secret key.
    The server scopes it to the authenticated actor, method, and path for at least 24 hours.
    Repeating the same key and request payload returns the original status and body with
    `Idempotency-Replayed: true`. Reusing a key with a different payload, or while the
    original request is still in progress, returns `409 IDEMPOTENCY_CONFLICT`.
servers:
  - url: http://localhost:8000/api/v1
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Profile
  - name: Scholarships
  - name: Matches
  - name: Applications
  - name: Documents
  - name: Admin ingestion
paths:
  /profile:
    get:
      operationId: getProfile
      tags: [Profile]
      summary: Get the authenticated student's profile.
      responses:
        "200":
          description: Profile found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      operationId: upsertProfile
      tags: [Profile]
      summary: Create or partially update the authenticated student's profile.
      description: |
        Omitted fields remain unchanged. Explicit null preserves an unknown value for nullable
        eligibility fields; it is distinct from false. New profiles require full_name, country,
        and study_level.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileWrite"
            examples:
              create:
                value:
                  full_name: Ada Student
                  country: BW
                  study_level: undergraduate
                  gpa: 4.2
                  gpa_scale: 5
                  requires_financial_aid: false
              partial_update:
                value: { field_of_study: Computer Science }
              explicit_unknown:
                value: { willing_to_relocate: null }
      responses:
        "200":
          description: Profile created or updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
  /profile/documents:
    get:
      operationId: listProfileDocuments
      tags: [Documents]
      summary: List private documents owned by the authenticated student.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Private document page. No storage paths or permanent object URLs are returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: uploadProfileDocument
      tags: [Documents]
      summary: Upload a private profile document for asynchronous processing.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [document_type, checksum_sha256, file]
              properties:
                document_type:
                  $ref: "#/components/schemas/DocumentType"
                display_name: { type: string, minLength: 1, maxLength: 200 }
                checksum_sha256: { type: string, pattern: "^[a-fA-F0-9]{64}$" }
                file:
                  type: string
                  format: binary
      responses:
        "202":
          description: Upload accepted for processing.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /profile/documents/policy:
    get:
      operationId: getDocumentUploadPolicy
      tags: [Documents]
      summary: Get the authoritative private-document upload policy.
      responses:
        "200":
          description: Current approved types, MIME types, and maximum file size.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentUploadPolicy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
  /profile/documents/readiness:
    get:
      operationId: getDocumentReadiness
      tags: [Documents]
      summary: Map required scholarship documents to private user documents.
      description: Mapping never shares a file with a scholarship provider.
      responses:
        "200":
          description: Document readiness grouped by tracked application.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentReadinessResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
  /profile/documents/{document_id}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    patch:
      operationId: renameProfileDocument
      tags: [Documents]
      summary: Rename a private document's display name.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentRename" }
      responses:
        "200":
          description: Document renamed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      operationId: replaceProfileDocument
      tags: [Documents]
      summary: Replace the bytes of a private document while retaining its identity.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [checksum_sha256, file]
              properties:
                checksum_sha256: { type: string, pattern: "^[a-fA-F0-9]{64}$" }
                file: { type: string, format: binary }
      responses:
        "202":
          description: Replacement accepted for scanning and processing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: deleteProfileDocument
      tags: [Documents]
      summary: Permanently delete a private document after explicit confirmation.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          {
            description: Document deleted. Readiness mappings are recalculated.,
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
  /profile/documents/{document_id}/download-url:
    post:
      operationId: createDocumentDownloadUrl
      tags: [Documents]
      summary: Create a short-lived signed download URL for one private document.
      description: Permanent object URLs and storage paths are never returned.
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Short-lived URL created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignedDocumentUrlResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /scholarships:
    get:
      operationId: listScholarships
      tags: [Scholarships]
      summary: List published scholarships.
      description: |
        Searches title, provider, field of study, and the normalized description.
        Results include the authenticated student's saved state and current
        eligibility assessment. Funding-amount sorting only compares records
        whose amount and currency are directly comparable.
      parameters:
        - $ref: "#/components/parameters/ScholarshipQuery"
        - $ref: "#/components/parameters/StudyLevel"
        - $ref: "#/components/parameters/Field"
        - $ref: "#/components/parameters/Destination"
        - $ref: "#/components/parameters/Nationality"
        - $ref: "#/components/parameters/Residency"
        - $ref: "#/components/parameters/FundingType"
        - $ref: "#/components/parameters/DeadlineFrom"
        - $ref: "#/components/parameters/DeadlineTo"
        - $ref: "#/components/parameters/Verified"
        - $ref: "#/components/parameters/ScholarshipSort"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Scholarship page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScholarshipPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
  /scholarships/{scholarship_id}:
    get:
      operationId: getScholarship
      tags: [Scholarships]
      summary: Get one published scholarship.
      parameters:
        - $ref: "#/components/parameters/ScholarshipId"
      responses:
        "200":
          description: Scholarship found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScholarshipResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /scholarships/{scholarship_id}/related:
    get:
      operationId: listRelatedScholarships
      tags: [Scholarships]
      summary: List related published scholarships from the current catalogue.
      parameters:
        - $ref: "#/components/parameters/ScholarshipId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Related scholarship page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScholarshipPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /scholarships/{scholarship_id}/saved:
    parameters:
      - $ref: "#/components/parameters/ScholarshipId"
    put:
      operationId: saveScholarship
      tags: [Scholarships]
      summary: Save a scholarship for the authenticated student.
      responses:
        "200":
          description: Scholarship saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedScholarshipResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: unsaveScholarship
      tags: [Scholarships]
      summary: Remove a scholarship from the authenticated student's saved list.
      responses:
        "204": { description: Scholarship removed from saved list. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /scholarships/{scholarship_id}/reports:
    post:
      operationId: reportScholarship
      tags: [Scholarships]
      summary: Report potentially inaccurate scholarship information.
      parameters:
        - $ref: "#/components/parameters/ScholarshipId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScholarshipReportCreate" }
      responses:
        "201":
          description: Report received.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScholarshipReportResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
  /matches:
    get:
      operationId: listMatches
      tags: [Matches]
      summary: List ranked matches for the authenticated student.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Match page, ordered by descending score with a stable ID tie-breaker.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
  /matches/recalculate:
    post:
      operationId: recalculateMatches
      tags: [Matches]
      summary: Queue a match recalculation for the authenticated student.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Recalculation queued.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /matches/recalculation-jobs/{job_id}:
    get:
      operationId: getMatchRecalculationJob
      tags: [Matches]
      summary: Get the status of a match recalculation job.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Recalculation job status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /matches/{scholarship_id}:
    get:
      operationId: getMatch
      tags: [Matches]
      summary: Get the authenticated student's match for one scholarship.
      parameters:
        - $ref: "#/components/parameters/ScholarshipId"
      responses:
        "200":
          description: Match found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /matches/{scholarship_id}/feedback:
    post:
      operationId: createMatchFeedback
      tags: [Matches]
      summary: Record structured feedback about one match explanation.
      description: Feedback is reviewed and evaluated; submission does not immediately retrain a model.
      parameters:
        - $ref: "#/components/parameters/ScholarshipId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatchFeedbackCreate" }
      responses:
        "201":
          description: Feedback received.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchFeedbackResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /applications:
    get:
      operationId: listApplications
      tags: [Applications]
      summary: List applications owned by the authenticated student.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Application page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
  /applications/deadlines:
    get:
      operationId: listApplicationDeadlines
      tags: [Applications]
      summary: List calendar-friendly deadlines for tracked applications.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Deadline page ordered chronologically with undated items last.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDeadlinePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: createApplication
      tags: [Applications]
      summary: Start tracking an application.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationCreate"
      responses:
        "201":
          description: Application created.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
  /applications/{application_id}:
    patch:
      operationId: updateApplication
      tags: [Applications]
      summary: Update mutable application tracking fields.
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationUpdate"
      responses:
        "200":
          description: Application updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
  /applications/{application_id}/checklist/{checklist_item_id}:
    put:
      operationId: updateApplicationChecklistItem
      tags: [Applications]
      summary: Set one checklist item's completion state.
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/ChecklistItemId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChecklistItemUpdate" }
      responses:
        "200":
          description: Application with refreshed checklist and readiness.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
  /applications/{application_id}/reminder:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    put:
      operationId: setApplicationReminder
      tags: [Applications]
      summary: Create or replace a private application reminder.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationReminderWrite" }
      responses:
        "200":
          description: Application with updated reminder.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: deleteApplicationReminder
      tags: [Applications]
      summary: Remove an application reminder.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Application with reminder removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
  /admin/scholarships:
    get:
      operationId: listAdminScholarships
      tags: [Admin ingestion]
      summary: List scholarships in every editorial lifecycle state.
      description: Requires a verified JWT with the application admin role.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { description: Admin scholarship page., content: { application/json: { schema: { $ref: "#/components/schemas/AdminScholarshipPage" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: createAdminScholarship
      tags: [Admin ingestion]
      summary: Create a draft scholarship record.
      description: Requires a verified JWT with the application admin role.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminScholarshipWrite" } } }
      responses:
        "201": { description: Draft created., content: { application/json: { schema: { $ref: "#/components/schemas/AdminScholarshipResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
  /admin/scholarships/bulk-preview:
    post:
      operationId: previewAdminScholarshipBulkAction
      tags: [Admin ingestion]
      summary: Preview a bounded bulk lifecycle action without changing data.
      description: Requires an admin role. At most 50 explicit scholarship UUIDs are accepted.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminBulkActionPreviewRequest" } } }
      responses:
        "200": { description: Preview with affected and blocked records., content: { application/json: { schema: { $ref: "#/components/schemas/AdminBulkActionPreviewResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
  /admin/scholarships/bulk-action:
    post:
      operationId: applyAdminScholarshipBulkAction
      tags: [Admin ingestion]
      summary: Apply a previously previewed bounded bulk lifecycle action.
      description: Requires an admin role and an unexpired server-issued preview token.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminBulkActionApplyRequest" } } }
      responses:
        "202": { description: Bulk action accepted., content: { application/json: { schema: { $ref: "#/components/schemas/AdminBulkActionResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
  /admin/scholarships/bulk-actions/{operation_id}/undo:
    parameters: [{ $ref: "#/components/parameters/OperationId" }]
    post:
      operationId: undoAdminScholarshipBulkAction
      tags: [Admin ingestion]
      summary: Undo a recoverable bounded bulk lifecycle action.
      description: Requires an admin role. The operation must still be inside its server-defined recovery window.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { description: Bulk action reverted., content: { application/json: { schema: { $ref: "#/components/schemas/AdminBulkUndoResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
  /admin/scholarships/{scholarship_id}:
    parameters: [{ $ref: "#/components/parameters/ScholarshipId" }]
    get:
      operationId: getAdminScholarship
      tags: [Admin ingestion]
      summary: Get one scholarship including review-only fields.
      description: Requires a verified JWT with the application admin role.
      responses:
        "200": { description: Admin scholarship detail., content: { application/json: { schema: { $ref: "#/components/schemas/AdminScholarshipResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      operationId: updateAdminScholarship
      tags: [Admin ingestion]
      summary: Edit mutable scholarship and reviewer fields.
      description: Requires an admin role. Published status is changed only through lifecycle operations.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminScholarshipPatch" } } }
      responses:
        "200": { description: Scholarship updated., content: { application/json: { schema: { $ref: "#/components/schemas/AdminScholarshipResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
  /admin/scholarships/{scholarship_id}/lifecycle:
    post:
      operationId: transitionAdminScholarship
      tags: [Admin ingestion]
      summary: Review, publish, unpublish, expire, or archive a scholarship.
      description: Requires an admin role. The server enforces allowed transitions and appends an audit event.
      parameters:
        - $ref: "#/components/parameters/ScholarshipId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminLifecycleTransition" } } }
      responses:
        "200": { description: Lifecycle transition applied., content: { application/json: { schema: { $ref: "#/components/schemas/AdminScholarshipResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
  /admin/scholarships/{scholarship_id}/requirements:
    put:
      operationId: replaceAdminScholarshipRequirements
      tags: [Admin ingestion]
      summary: Replace structured scholarship requirements after validation.
      description: Requires an admin role and preserves the prior version in audit history.
      parameters:
        - $ref: "#/components/parameters/ScholarshipId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminRequirementSetWrite" } } }
      responses:
        "200": { description: Requirements replaced., content: { application/json: { schema: { $ref: "#/components/schemas/AdminScholarshipResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
  /admin/duplicates:
    get:
      operationId: listAdminDuplicateGroups
      tags: [Admin ingestion]
      summary: List unresolved scholarship duplicate groups.
      description: Requires a verified JWT with the application admin role.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { description: Duplicate group page., content: { application/json: { schema: { $ref: "#/components/schemas/AdminDuplicatePage" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /admin/duplicates/{duplicate_id}/merge:
    post:
      operationId: mergeAdminDuplicateGroup
      tags: [Admin ingestion]
      summary: Merge a duplicate group into a selected canonical scholarship.
      description: Requires an admin role. Every source-history record is retained on the canonical record.
      parameters:
        - $ref: "#/components/parameters/DuplicateId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminDuplicateMergeRequest" } } }
      responses:
        "200": { description: Duplicate group merged with source history preserved., content: { application/json: { schema: { $ref: "#/components/schemas/AdminDuplicateMergeResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
  /admin/verification-queue:
    get:
      operationId: listAdminVerificationQueue
      tags: [Admin ingestion]
      summary: List scholarships requiring source-change or freshness review.
      description: Requires a verified JWT with the application admin role.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { description: Verification queue page., content: { application/json: { schema: { $ref: "#/components/schemas/AdminVerificationPage" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /admin/verification-queue/{scholarship_id}/verify:
    post:
      operationId: verifyAdminScholarship
      tags: [Admin ingestion]
      summary: Record a completed source verification review.
      description: Requires an admin role and appends an audit event.
      parameters:
        - $ref: "#/components/parameters/ScholarshipId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminVerificationWrite" } } }
      responses:
        "200": { description: Verification completed., content: { application/json: { schema: { $ref: "#/components/schemas/AdminVerificationItem" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
  /admin/audit-events:
    get:
      operationId: listAdminAuditEvents
      tags: [Admin ingestion]
      summary: List append-only administrative audit events.
      description: Requires a verified JWT with the application admin role.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { description: Audit event page., content: { application/json: { schema: { $ref: "#/components/schemas/AdminAuditEventPage" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /admin/ingestion-runs:
    get:
      operationId: listIngestionRuns
      tags: [Admin ingestion]
      summary: List ingestion runs newest first.
      description: Requires a verified JWT with the application admin role.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { description: Ingestion run page., content: { application/json: { schema: { $ref: "#/components/schemas/IngestionRunPage" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: createIngestionRun
      tags: [Admin ingestion]
      summary: Queue a scholarship ingestion run.
      description: Requires a verified JWT with the application admin role.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestionRunCreate"
      responses:
        "202":
          description: Ingestion run queued.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionRunResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /admin/ingestion-runs/{run_id}:
    get:
      operationId: getIngestionRun
      tags: [Admin ingestion]
      summary: Get one ingestion run and its counters.
      description: Requires a verified JWT with the application admin role.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Ingestion run found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionRunResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /admin/ingestion-runs/{run_id}/retry:
    post:
      operationId: retryIngestionRun
      tags: [Admin ingestion]
      summary: Queue a retry of a failed or cancelled ingestion run.
      description: Requires an admin role. The retry links to the original run and is idempotent.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202": { description: Retry queued., content: { application/json: { schema: { $ref: "#/components/schemas/IngestionRunResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase access token; the API verifies signature, issuer, audience, expiry, and subject.
  parameters:
    ScholarshipQuery:
      name: q
      in: query
      required: false
      description: Searches title, provider, field, and normalized description.
      schema: { type: string, minLength: 1, maxLength: 200 }
    StudyLevel:
      name: study_level
      in: query
      required: false
      schema: { $ref: "#/components/schemas/ScholarshipStudyLevel" }
    Field:
      name: field
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 100 }
    Destination:
      name: destination
      in: query
      required: false
      schema:
        {
          type: string,
          minLength: 2,
          maxLength: 2,
          description: ISO 3166-1 alpha-2 code.,
        }
    Nationality:
      name: nationality
      in: query
      required: false
      schema:
        {
          type: string,
          minLength: 2,
          maxLength: 2,
          description: ISO 3166-1 alpha-2 code used for compatibility filtering.,
        }
    Residency:
      name: residency
      in: query
      required: false
      schema:
        {
          type: string,
          minLength: 2,
          maxLength: 2,
          description: ISO 3166-1 alpha-2 code used for compatibility filtering.,
        }
    FundingType:
      name: funding_type
      in: query
      required: false
      schema: { $ref: "#/components/schemas/FundingType" }
    DeadlineFrom:
      name: deadline_from
      in: query
      required: false
      schema: { type: string, format: date }
    DeadlineTo:
      name: deadline_to
      in: query
      required: false
      schema: { type: string, format: date }
    Verified:
      name: verified
      in: query
      required: false
      schema: { type: boolean }
    ScholarshipSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [relevance, deadline, recently_verified, funding_amount]
        default: relevance
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned as `pagination.next_cursor`; clients must not parse it.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Caller-generated opaque key. Do not include credentials or personal data.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9._~-]+$"
    ScholarshipId:
      name: scholarship_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApplicationId:
      name: application_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RunId:
      name: run_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DuplicateId:
      name: duplicate_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OperationId:
      name: operation_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentId:
      name: document_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChecklistItemId:
      name: checklist_item_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    JobId:
      name: job_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  headers:
    IdempotencyReplayed:
      description: "`true` when this response replays a completed request."
      schema: { type: boolean }
  responses:
    BadRequest:
      description: Malformed request or cursor.
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorEnvelope" } },
        }
    Unauthorized:
      description: Bearer token is missing or invalid.
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorEnvelope" } },
        }
    Forbidden:
      description: Authenticated actor lacks the required role or permission.
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorEnvelope" } },
        }
    NotFound:
      description: Resource was not found or is not visible to the actor.
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorEnvelope" } },
        }
    Conflict:
      description: State, duplicate resource, or idempotency conflict.
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorEnvelope" } },
        }
    PayloadTooLarge:
      description: Uploaded file exceeds the configured limit.
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorEnvelope" } },
        }
    UnsupportedMediaType:
      description: Uploaded file type is not allowed.
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorEnvelope" } },
        }
    ValidationError:
      description: Request fields failed semantic validation.
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorEnvelope" } },
        }
    RateLimited:
      description: Request rate exceeded.
      headers:
        Retry-After:
          description: Seconds until the client should retry.
          schema: { type: integer, minimum: 1 }
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorEnvelope" } },
        }
    InternalError:
      description: Unexpected server error with no sensitive implementation details.
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorEnvelope" } },
        }
  schemas:
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details, request_id]
          properties:
            code:
              type: string
              pattern: "^[A-Z][A-Z0-9_]+$"
              examples: [VALIDATION_ERROR]
            message:
              type: string
              description: Safe, human-readable summary.
            details:
              type: array
              description: Safe structured details; empty when no field-specific detail exists.
              default: []
              items:
                type: object
                additionalProperties: false
                required: [code]
                properties:
                  code: { type: string }
                  field: { type: [string, "null"] }
                  message: { type: [string, "null"] }
            request_id:
              type: string
              format: uuid
    Pagination:
      type: object
      additionalProperties: false
      required: [next_cursor, has_more, limit]
      properties:
        next_cursor:
          type: [string, "null"]
          description: Opaque cursor for the next page; null on the final page.
        has_more: { type: boolean }
        limit: { type: integer, minimum: 1, maximum: 100 }
    ProfileWrite:
      type: object
      additionalProperties: false
      properties:
        full_name: { type: [string, "null"], minLength: 1, maxLength: 200 }
        country:
          {
            type: [string, "null"],
            minLength: 2,
            maxLength: 2,
            description: ISO 3166-1 alpha-2 code.,
          }
        study_level:
          {
            type: [string, "null"],
            enum: [secondary, undergraduate, postgraduate, doctoral, vocational, other, null],
          }
        field_of_study: { type: [string, "null"], maxLength: 200 }
        gpa: { type: [number, "null"], minimum: 0, maximum: 100 }
        gpa_scale: { type: [number, "null"], exclusiveMinimum: 0, maximum: 100 }
        nationality_country: { type: [string, "null"], minLength: 2, maxLength: 2 }
        residence_country: { type: [string, "null"], minLength: 2, maxLength: 2 }
        date_of_birth: { type: [string, "null"], format: date }
        interests:
          type: [array, "null"]
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 100 }
        target_countries:
          type: [array, "null"]
          maxItems: 50
          uniqueItems: true
          items: { type: string, minLength: 2, maxLength: 2 }
        goals: { type: [string, "null"], maxLength: 4000 }
        requires_financial_aid: { type: [boolean, "null"] }
        willing_to_relocate: { type: [boolean, "null"] }
    ProfileResponse:
      type: object
      additionalProperties: false
      required:
        [id, full_name, country, study_level, interests, target_countries, data_version, completeness, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string, minLength: 1, maxLength: 200 }
        country:
          {
            type: string,
            minLength: 2,
            maxLength: 2,
            description: ISO 3166-1 alpha-2 code.,
          }
        study_level:
          { type: string, enum: [secondary, undergraduate, postgraduate, doctoral, vocational, other] }
        field_of_study: { type: [string, "null"], maxLength: 200 }
        gpa: { type: [number, "null"], minimum: 0, maximum: 100 }
        gpa_scale: { type: [number, "null"], exclusiveMinimum: 0, maximum: 100 }
        nationality_country: { type: [string, "null"], minLength: 2, maxLength: 2 }
        residence_country: { type: [string, "null"], minLength: 2, maxLength: 2 }
        date_of_birth: { type: [string, "null"], format: date }
        interests:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 100 }
        target_countries:
          type: array
          maxItems: 50
          uniqueItems: true
          items: { type: string, minLength: 2, maxLength: 2 }
        goals: { type: [string, "null"], maxLength: 4000 }
        requires_financial_aid: { type: [boolean, "null"] }
        willing_to_relocate: { type: [boolean, "null"] }
        data_version: { type: integer, minimum: 1 }
        completeness: { $ref: "#/components/schemas/ProfileCompleteness" }
        created_at:
          {
            type: string,
            format: date-time,
            description: UTC ISO-8601 timestamp.,
          }
        updated_at:
          {
            type: string,
            format: date-time,
            description: UTC ISO-8601 timestamp.,
          }
    ProfileCompleteness:
      type: object
      additionalProperties: false
      required:
        [version, percent, required_completed, required_total, recommended_completed, recommended_total, missing_required, missing_recommended]
      properties:
        version: { type: string, examples: ["2026-08-01"] }
        percent: { type: integer, minimum: 0, maximum: 100 }
        required_completed: { type: integer, minimum: 0 }
        required_total: { type: integer, minimum: 0 }
        recommended_completed: { type: integer, minimum: 0 }
        recommended_total: { type: integer, minimum: 0 }
        missing_required: { type: array, items: { type: string } }
        missing_recommended: { type: array, items: { type: string } }
    DocumentType:
      type: string
      enum:
        [
          transcript,
          cv,
          recommendation_letter,
          personal_statement,
          identity_document,
          financial_document,
          other,
        ]
    DocumentResponse:
      type: object
      additionalProperties: false
      required:
        [
          id,
          document_type,
          display_name,
          original_filename,
          mime_type,
